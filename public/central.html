<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central FNANDO</title>
<style>
  :root { --bg: #0e0f13; --card: #181a21; --card2: #1f222b; --line: #2a2d38; --text: #f2f3f5; --muted: #9aa0ad; --hi: #ffe600; --ok: #2ecc71; --no: #ff5c5c; --cy: #00e0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topo { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; max-width: 1180px; margin: 0 auto; }
  .topo h1 { font-size: 18px; margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; }
  .topo a { color: var(--hi); font-weight: 600; text-decoration: none; font-size: 14px; }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 10px; max-width: 1180px; margin: 0 auto; scrollbar-width: none; }
  nav button { flex: none; background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { color: var(--bg); background: var(--hi); border-color: var(--hi); font-weight: 600; }
  nav .n { margin-left: 6px; font-size: 12px; opacity: .8; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 15px; margin: 22px 0 10px; }
  h2 small { color: var(--muted); font-weight: 400; }
  p.dica { color: var(--muted); margin: 4px 0 14px; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .kpi.forte { border-color: var(--hi); }
  .lista { display: grid; gap: 8px; }
  .linha { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .linha .nome { font-weight: 600; flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
  .linha .sub { color: var(--muted); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); } .tag.hi { color: var(--hi); } .tag.no { color: var(--no); } .tag.cy { color: var(--cy); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .corte { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .corte video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; display: block; }
  .corte.longo video { aspect-ratio: 16/9; }
  .corte .corpo { padding: 9px 11px 11px; display: grid; gap: 5px; }
  .corte .t { font-weight: 600; font-size: 14px; }
  .corte .sub { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
  .roteiro { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .roteiro summary { padding: 11px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
  .roteiro summary::-webkit-details-marker { display: none; }
  .roteiro summary .nome { flex: 1; font-weight: 600; }
  .roteiro pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; font: 14px/1.5 -apple-system, system-ui, sans-serif; color: #d9dbe0; }
  .envio { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--muted); margin-bottom: 14px; }
  .envio.sobre { border-color: var(--hi); color: var(--text); }
  .envio label { color: var(--hi); font-weight: 600; cursor: pointer; }
  .barra { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--hi); transition: width .2s; }
  .vazio { color: var(--muted); text-align: center; padding: 36px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
  .redes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .conta { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
  .conta .r { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  .conta b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .conta.off { opacity: .6; border-style: dashed; }
  code { background: var(--card2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  a.btn { display: inline-block; background: var(--hi); color: var(--bg); font-weight: 700; text-decoration: none; padding: 8px 14px; border-radius: 8px; }
  .gerir { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .gerir .conta { gap: 8px; }
  .gerir .topo2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gerir .topo2 .r { margin-right: auto; }
  .passo { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
  .passo input { margin-top: 3px; accent-color: var(--hi); }
  .passo.feito span { color: var(--muted); text-decoration: line-through; }
  .anon { font-size: 11px; color: var(--cy); font-weight: 700; margin-left: 4px; white-space: nowrap; }
  .campo { background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 9px; font: inherit; font-size: 14px; min-width: 0; }
  .aviso { font-size: 13px; color: var(--hi); }
  .prog { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--hi); }
  svg.graf { width: 100%; height: 120px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1><img src="/marca/fnando-simbolo.svg" alt="" width="26" height="26">Central</h1>
    <a href="/cortes">Aprovar cortes →</a>
    <a href="/escritorio">Escritório →</a>
  </div>
  <nav id="abas">
    <button data-a="inicio" class="on">Início</button>
    <button data-a="brutos">Vídeos brutos<span class="n" data-n="brutos"></span></button>
    <button data-a="cortes">Cortes<span class="n" data-n="cortes"></span></button>
    <button data-a="longos">Vídeo longo<span class="n" data-n="longos"></span></button>
    <button data-a="radar">Radar da gringa<span class="n" data-n="radar"></span></button>
    <button data-a="roteiros">Roteiros<span class="n" data-n="roteiros"></span></button>
    <button data-a="prontos">Prontos p/ postar<span class="n" data-n="prontos"></span></button>
    <button data-a="redes">Redes</button>
    <button data-a="contas">Contas<span class="n" data-n="contas"></span></button>
    <button data-a="checklist">Checklist<span class="n" data-n="checklist"></span></button>
  </nav>
</header>
<main id="tela"><p class="vazio">Carregando...</p></main>
<script>
let D = null, P = null, C = null, A = null, aba = (location.hash || '#inicio').slice(1);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const midia = (p, a) => `/midia/${encodeURIComponent(p)}/${String(a).split('/').map(encodeURIComponent).join('/')}`;
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const mb = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const quando = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const dur = (s) => s ? (s >= 60 ? `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, '0')} s` : `${Math.round(s)} s`) : '';
const COR = { 'a criar': 'no', criando: 'hi', criada: 'cy', conectada: 'ok', reconectar: 'no',  aguardando: 'hi', aprovado: 'ok', entregue: 'cy', postado: 'ok', agendado: 'cy', descartado: 'no', 'na fila': 'hi', gravando: 'no', processando: 'cy', processado: 'ok', 'esperando a postagem': 'hi' };
const tag = (s) => `<span class="tag ${COR[s] || ''}">${esc(s)}</span>`;
const LINK_REDE = { youtube: 'https://studio.youtube.com', facebook: 'https://www.facebook.com/pages/create', instagram: 'https://www.instagram.com/accounts/emailsignup/', tiktok: 'https://www.tiktok.com/login', twitch: 'https://www.twitch.tv/signup' };
const NOME_REDE = { youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Facebook', twitch: 'Twitch' };

async function carregar() {
  try { D = await (await fetch('/api/central')).json(); } catch { D = null; }
  try { P = await (await fetch('/api/prontidao')).json(); } catch { P = null; }
  try { C = await (await fetch('/api/contas')).json(); } catch { C = null; }
  try { A = await (await fetch('/api/apis')).json(); } catch { A = null; }
  desenhar();
}

function contadores() {
  const r = D.resumo;
  const fc = C ? C.contas.filter((c) => c.status !== 'conectada').length : 0;
  const rn = D.radar ? D.radar.itens.filter((i) => !i.cortes.length).length : 0;
  const n = { radar: rn ? `${rn} p/ gravar` : '', contas: fc ? `${fc} a fazer` : '', checklist: P?.faltam ? `faltam ${P.faltam}` : '', brutos: r.brutos, cortes: r.aguardando ? `${r.aguardando} p/ aprovar` : r.cortes, longos: r.longos, roteiros: r.roteiros, prontos: r.prontos };
  document.querySelectorAll('[data-n]').forEach((el) => { const v = n[el.dataset.n]; el.textContent = v ? v : ''; });
}

const TELAS = {
  inicio() {
    const r = D.resumo;
    const k = (n, t, a, forte) => `<div class="kpi${forte ? ' forte' : ''}" data-ir="${a}"><b>${n}</b><span>${t}</span></div>`;
    const ultimos = D.sessoes.flatMap((s) => s.cortes.map((c) => ({ ...c, pasta: s.pasta }))).slice(0, 6);
    const aviso = P?.faltam ? `<p class="vazio" style="text-align:left;padding:14px 16px;margin:0 0 14px;border-color:var(--hi)">Faltam <b style="color:var(--hi)">${P.faltam}</b> coisa(s) para ligar as redes. <a href="#checklist" style="color:var(--hi);font-weight:600">Ver o checklist →</a></p>` : '';
    return `${aviso}<div class="kpis">
      ${k(r.brutosNaFila, 'vídeos brutos na fila', 'brutos')}
      ${k(r.aguardando, 'cortes esperando você', 'cortes', r.aguardando > 0)}
      ${k(r.longos, 'vídeos longos', 'longos')}
      ${k(r.roteiros, 'roteiros e ideias', 'roteiros')}
      ${k(r.prontos, 'prontos para postar', 'prontos')}
      ${k(r.postados, 'já postados', 'prontos')}
      ${k(num(r.seguidores), 'seguidores (todas as redes)', 'redes')}
      ${k(num(r.views7d), 'visualizações em 7 dias', 'redes')}
    </div>
    <h2>Como o vídeo entra</h2>
    <p class="dica">Grave no OBS: a gravação cai em <code>${esc(D.pastas.entrada)}</code> e a plataforma pega sozinha. Ou arraste um vídeo na aba <a href="#brutos" style="color:var(--hi)">Vídeos brutos</a>.</p>
    <h2>Últimos cortes</h2>
    ${ultimos.length ? `<div class="grade">${ultimos.map(cardCorte).join('')}</div>` : '<p class="vazio">Ainda não tem corte. Grave uma sessão e ele aparece aqui.</p>'}`;
  },
  brutos() {
    return `<div class="envio" id="envio">Arraste um vídeo aqui ou <label>escolha no computador<input type="file" accept="video/*" hidden id="arquivo"></label>.<br>Ele vai para a pasta do OBS e vira cortes sozinho.<div class="barra" hidden><i></i></div><div id="envioMsg"></div></div>
    ${D.brutos.length ? `<div class="lista">${D.brutos.map((b) => `<div class="linha">
        <div class="nome">${esc(b.nome)}<div class="sub">${mb(b.bytes)} · ${quando(b.modificadoEm)}${b.duracao ? ' · ' + dur(b.duracao) : ''}${b.sessao ? ` · ${b.cortes} corte(s)${b.longo ? ' + vídeo longo' : ''}` : ''}</div></div>
        ${tag(b.status)}</div>`).join('')}</div>` : '<p class="vazio">Nenhuma gravação ainda.</p>'}`;
  },
  cortes() {
    const html = D.sessoes.filter((s) => s.cortes.length).map((s) => `<h2>${esc(s.sessao)} <small>· ${s.cortes.length} corte(s)</small></h2>
      <div class="grade">${s.cortes.map((c) => cardCorte({ ...c, pasta: s.pasta })).join('')}</div>`).join('');
    return `<p class="dica">Para editar título, trocar o formato e aprovar, use <a href="/cortes" style="color:var(--hi)">Aprovar cortes</a>. Aprovado vai para a pasta da sua skill de postagem.</p>${html || '<p class="vazio">Nenhum corte ainda.</p>'}`;
  },
  longos() {
    const l = D.sessoes.flatMap((s) => [...(s.longo ? [{ ...s.longo, pasta: s.pasta, tipo: 'Sessão inteira' }] : []), ...(s.missoes || []).map((m) => ({ ...m, pasta: s.pasta, tipo: `Missão: ${m.missao || ''}` }))]);
    return l.length ? `<p class="dica">Vídeos do YouTube: a sessão inteira e uma por missão. Para editar e aprovar, use <a href="/cortes" style="color:var(--hi)">Aprovar cortes</a>.</p><div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${l.map((v) => `<div class="corte longo">
      <video src="${midia(v.pasta, v.arquivo)}" ${v.thumb ? `poster="${midia(v.pasta, v.thumb)}"` : ''} controls playsinline preload="none"></video>
      <div class="corpo"><div class="t">${esc(v.titulo || v.missao)}</div><div class="sub"><span>${esc(v.tipo)} · ${dur(v.duracao)}</span>${tag(v.status || 'aguardando')}</div></div></div>`).join('')}</div>`
      : '<p class="vazio">Os vídeos longos do YouTube aparecem aqui depois que uma sessão é processada.</p>';
  },
  radar() {
    const R = D.radar || { itens: [] };
    const it = [...R.itens].sort((a, b) => (a.cortes.length > 0) - (b.cortes.length > 0) || a.prioridade - b.prioridade);
    return `<p class="dica">O que bombou lá fora${R.jogo ? ' em ' + esc(R.jogo) : ''}${R.atualizadoEm ? ` (lista de ${quando(R.atualizadoEm)})` : ''}. Quando você fala desses assuntos numa gravação, o trecho vira corte com prioridade e com o título sugerido. Os de cima ainda não têm corte: são os que valem gravar.</p>
    ${it.length ? `<div class="lista">${it.map((i) => `<details class="roteiro"><summary><span class="nome">${esc(i.titulo)}</span>${i.prioridade <= 1 ? '<span class="tag hi">prioridade</span>' : ''}${i.confirmado ? '' : '<span class="tag">não confirmado</span>'}${i.coberto_no_br ? '<span class="tag">já tem no BR</span>' : ''}${i.cortes.length ? `<span class="tag ok">${i.cortes.length} corte(s)</span>` : '<span class="tag no">falta gravar</span>'}</summary>
      <pre>${esc([i.o_que_e || i.resumo, i.como_achar ? 'Como achar: ' + i.como_achar : '', i.tituloSugerido ? 'Título: ' + i.tituloSugerido : '', i.gancho ? 'Gancho: ' + i.gancho : '', 'Palavras que a central procura na sua fala: ' + [...i.palavras, ...i.frases].join(', '), ...i.cortes.map((c) => `Corte: ${c.titulo} (${c.status})`)].filter(Boolean).join('\n'))}</pre>
      ${/^https:\/\//.test(i.fonte || '') ? `<p class="dica" style="padding:0 12px 10px;margin:0"><a href="${esc(i.fonte)}" target="_blank" rel="noopener" style="color:var(--cy)">fonte</a></p>` : ''}</details>`).join('')}</div>` : '<p class="vazio">O radar ainda não mandou nada.</p>'}`;
  },
  roteiros() {
    return `<p class="dica">Ideias de vídeo, roteiros de short e de live. Ficam em <code>${esc(D.pastas.roteiros)}</code> (arquivos .md ou .json).</p>
    ${D.roteiros.length ? `<div class="lista">${D.roteiros.map((r, i) => `<details class="roteiro"${i === 0 ? ' open' : ''}><summary><span class="nome">${esc(r.titulo || r.arquivo)}</span><span class="tag">${esc(r.tipo)}</span>${tag(r.status)}</summary><pre>${esc(r.texto)}</pre></details>`).join('')}</div>` : '<p class="vazio">Nenhum roteiro ainda.</p>'}`;
  },
  prontos() {
    return `<p class="dica">O que foi aprovado e entregue para a sua skill de postagem, em <code>${esc(D.pastas.entrega)}</code>. Quando a skill posta, ela grava <code>postado.json</code> na pasta e o corte vira "postado" aqui.</p>
    ${D.prontos.length ? `<div class="lista">${D.prontos.map((p) => `<div class="linha"><div class="nome">${esc(p.titulo)}<div class="sub">${esc(p.linha)} · ${esc((p.redes || []).map((r) => NOME_REDE[r] || r).join(', '))} · ${p.postadoEm ? 'postado ' + quando(p.postadoEm) : p.agendarPara ? 'vai ao ar ' + quando(p.agendarPara) : quando(p.criadoEm)}</div></div>
      ${Object.entries(p.links || {}).map(([r, u]) => /^https:\/\//.test(u) ? `<a class="tag cy" href="${esc(u)}" target="_blank" rel="noopener">${esc(NOME_REDE[r] || r)}</a>` : '').join('')}${tag(p.status)}</div>`).join('')}</div>` : '<p class="vazio">Nada entregue ainda. Aprove um corte e ele vem para cá.</p>'}`;
  },
  checklist() {
    if (!P) return '<p class="vazio">Carregando...</p>';
    const item = (i) => `<div class="linha"><span class="tag ${i.ok ? 'ok' : 'no'}">${i.ok ? 'pronto' : 'falta'}</span><div class="nome">${esc(i.titulo)}${i.ok ? '' : `<div class="sub">${esc(i.comoFazer)}</div>`}</div><span class="tag">${i.dono === 'voce' ? 'com você' : 'plataforma'}</span></div>`;
    return `<p class="dica">${P.faltam ? `Faltam ${P.faltam} item(ns).` : 'Tudo pronto.'} Com as contas de hoje, o limite seguro é de <b>${P.capacidadeDia}</b> post(s) por dia. Para postar mais, crie mais contas, nunca mais posts por conta.</p>
    <div class="lista">${[...P.itens].sort((a, b) => a.ok - b.ok).map(item).join('')}</div>`;
  },
  contas() {
    if (!C) return '<p class="vazio">Carregando...</p>';
    const porChave = Object.fromEntries(C.contas.map((c) => [c.chave, c]));
    const card = (c) => {
      const g = porChave[c.precisa];
      const falta = g && g.status === 'a criar' ? `<div class="aviso">Crie antes a Página do Facebook desta linha: o Instagram só posta pela skill ligado a uma Página.</div>` : '';
      const acao = c.status === 'reconectar' ? `<div class="aviso">${esc(c.motivo)}. Entre na sua skill de autopost e conecte esta conta de novo.</div>` : '';
      return `<div class="conta" data-chave="${esc(c.chave)}">
        <div class="topo2"><span class="r">${esc(NOME_REDE[c.rede] || c.rede)} · ${esc(c.nome)}${c.soPara ? ' · para o Instagram' : ''}</span>${tag(c.status)}</div>
        <div class="prog"><i style="width:${(c.feitos / c.total) * 100}%"></i></div>
        ${falta}${acao}
        ${c.rede === 'tiktok' ? `<div class="aviso" style="color:var(--muted)">Postagem pela extensão <b>FNANDO: TikTok pelo Chrome</b> (pasta <code>extensao-tiktok</code>): carregue no Chrome logado neste TikTok e cole o código. <a class="btn" href="#" data-codigo-tiktok>Mostrar código</a> <code data-codigo-saida style="user-select:all;word-break:break-all"></code></div>` : ''}
        ${c.passos.map((p) => `<label class="passo${p.feito ? ' feito' : ''}"><input type="checkbox" data-passo="${p.id}"${p.feito ? ' checked' : ''}><span>${esc(p.t)}${p.anonimo ? '<span class="anon">anonimato</span>' : ''}</span></label>`).join('')}
        <div class="topo2"><input class="campo" data-arroba placeholder="@ da conta" value="${esc(c.arroba)}" style="flex:1 1 120px"><a class="btn" href="${esc(LINK_REDE[c.rede])}" target="_blank" rel="noopener">${c.status === 'reconectar' ? 'Reconectar' : 'Abrir'} ${esc(NOME_REDE[c.rede] || c.rede)}</a></div>
        <input class="campo" data-nota placeholder="Anotação (nunca senha ou código)" value="${esc(c.nota)}">
        ${c.seguidores != null ? `<span class="sub" style="color:var(--muted);font-size:13px">${num(c.seguidores)} seguidores${c.link ? ` · <a href="${esc(c.link)}" target="_blank" rel="noopener" style="color:var(--cy)">ver perfil</a>` : ''}</span>` : ''}
      </div>`;
    };
    const ordem = { youtube: 0, facebook: 1, instagram: 2, tiktok: 3, twitch: 4 };
    const linhas = [...new Set(C.contas.map((c) => c.linha))];
    const api = (nome, st, extra = '') => `<div class="linha"><span class="tag ${st.status === 'conectada' ? 'ok' : 'no'}">${esc(st.status)}</span><div class="nome">${esc(nome)}${st.conta ? ` · ${esc(st.conta)}` : ''}<div class="sub">${esc(st.motivo || '')}${extra}</div></div></div>`;
    const apis = !A ? '' : `<h2>Postagem automática</h2>
    <p class="dica">${A.postador.pausa ? `<b>Freio puxado:</b> ${esc(A.postador.pausa.motivo || '')} (retome na aba Início). ` : ''}Postador das APIs: <b>${A.postador.ligado ? 'ligado' : 'desligado'}</b> · aprovação automática: <b>${A.postador.automatico ? 'ligada (filtro de qualidade)' : 'desligada'}</b>. Um envio por vez, só no horário agendado e dentro do limite seguro de cada conta. TikTok vai pela extensão do Chrome.</p>
    <div class="lista">${api('Instagram (API oficial)', A.instagram)}${api('Página do Facebook (API oficial)', A.facebook)}${api('YouTube (API oficial)', A.youtube, A.youtube.privado ? ' <b>O YouTube está travando os envios como privados: falta a auditoria do projeto no Google Cloud.</b>' : '')}</div>
    <div class="gerir">
      <div class="conta"><div class="topo2"><span class="r">Meta · app ${esc(A.meta.appId)}</span>${tag(A.instagram.status === 'conectada' ? 'conectada' : 'a criar')}</div>
        <input class="campo" type="password" autocomplete="off" data-cred="meta" data-campo="appSecret" placeholder="${A.meta.temSegredo ? 'Chave secreta guardada (cole só para trocar)' : 'Chave secreta do app (Configurações > Básico)'}">
        <div class="topo2"><a class="btn" href="#" data-salvar-cred="meta">Salvar chave</a><a class="btn" href="/oauth/meta/iniciar">Conectar Instagram e Página</a></div></div>
      <div class="conta"><div class="topo2"><span class="r">Google · YouTube</span>${tag(A.youtube.status === 'conectada' ? 'conectada' : 'a criar')}</div>
        <input class="campo" type="password" autocomplete="off" data-cred="youtube" data-campo="clientSecret" placeholder="${A.google.temSegredo ? 'Chave secreta guardada (cole só para trocar)' : 'Chave secreta do cliente OAuth do Google'}">
        <div class="topo2"><a class="btn" href="#" data-salvar-cred="youtube">Salvar chave</a><a class="btn" href="/oauth/youtube/iniciar">Conectar YouTube</a></div></div>
    </div>
    <p class="dica">As chaves ficam só em <code>~/Gameplay/.credenciais.json</code> neste Mac e nunca voltam para a página. Conectar só funciona abrindo a central em http://localhost:4322 no próprio Mac.</p>`;
    return `${apis}<p class="dica">Ordem para hoje: 1) um e-mail novo só para o canal, 2) YouTube, 3) a Página do Facebook, 4) Instagram ligado a ela, 5) TikTok. Os passos marcados <span class="anon">anonimato</span> evitam que a conta seja sugerida aos seus contatos e conhecidos. O progresso fica em <code>${esc(C.arquivo)}</code>. <b>Senhas e códigos ficam só no seu gerenciador de senhas, nunca aqui.</b></p>
    ${linhas.map((l) => `<h2>${esc(C.contas.find((c) => c.linha === l).nome)}</h2><div class="gerir">${C.contas.filter((c) => c.linha === l).sort((a, b) => ordem[a.rede] - ordem[b.rede]).map(card).join('')}</div>`).join('')}
    <h2>Onde dá para fazer live</h2>
    <div class="lista">${C.live.map((v) => `<div class="linha"><span class="tag ${v.pode ? 'ok' : 'no'}">${v.pode ? 'dá hoje' : 'ainda não'}</span><div class="nome">${esc(v.nome)}<div class="sub">${esc(v.resumo)} ${esc(v.requisito)}${v.seguidores != null && !v.pode ? ` Hoje: ${num(v.seguidores)} seguidores.` : ''}</div></div></div>`).join('')}</div>
    <p class="dica">As regras de live mudam. Se o app disser outra coisa, vale o app.</p>
    <h2>Adicionar outra conta</h2>
    <div class="topo2" style="display:flex;gap:8px;flex-wrap:wrap"><input class="campo" id="novaNome" placeholder="Nome da linha (ex.: Dicas)"><select class="campo" id="novaRede">${Object.keys(LINK_REDE).map((r) => `<option value="${r}">${NOME_REDE[r]}</option>`).join('')}</select><a class="btn" href="#" id="novaConta">Adicionar</a><span id="contaMsg" class="aviso"></span></div>`;
  },
  redes() {
    const R = D.redes;
    const h = R.historico || [];
    let graf = '';
    if (h.length > 1) {
      const max = Math.max(...h.map((x) => x.seguidores || 0), 1);
      const pts = h.map((x, i) => `${(i / (h.length - 1)) * 100},${100 - ((x.seguidores || 0) / max) * 90}`).join(' ');
      graf = `<h2>Seguidores <small>· últimos ${h.length} dias</small></h2><svg class="graf" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--hi)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
    }
    return `<p class="dica">${R.atualizadoEm ? `Números de ${quando(R.atualizadoEm)}.` : 'Nenhuma conta conectada ainda.'} Os números vêm de <code>${esc(D.pastas.metricas)}</code>, que a sua skill de redes escreve.</p>
    <div class="kpis"><div class="kpi"><b>${num(R.total.seguidores)}</b><span>seguidores</span></div><div class="kpi"><b>${num(R.total.views7d)}</b><span>views em 7 dias</span></div><div class="kpi"><b>${num(R.total.curtidas7d)}</b><span>curtidas em 7 dias</span></div><div class="kpi"><b>${num(R.total.posts)}</b><span>posts</span></div></div>
    ${graf}
    <h2>Contas</h2><div class="redes">${R.contas.map((c) => `<div class="conta${c.conectada ? '' : ' off'}">
      <span class="r">${esc(NOME_REDE[c.rede] || c.rede)} · ${esc(c.nome || '')}</span>
      ${c.conectada ? `<b>${num(c.seguidores)}</b><span class="sub" style="color:var(--muted);font-size:13px">seguidores · ${num(c.views7d)} views/7d${c.arroba ? ' · ' + esc(c.arroba) : ''}</span>` : '<span style="color:var(--muted);font-size:13px">ainda não conectada</span>'}
    </div>`).join('')}</div>`;
  },
};

function cardCorte(c) {
  return `<div class="corte"><video src="${midia(c.pasta, c.arquivo)}" ${c.capa ? `poster="${midia(c.pasta, c.capa)}"` : ''} controls playsinline preload="none"></video>
    <div class="corpo"><div class="t">${esc(c.titulo)}</div><div class="sub"><span>${Math.round((c.fim || 0) - (c.inicio || 0))} s · nota ${Number(c.nota || 0).toFixed(1)}</span>${tag(c.status)}</div></div></div>`;
}

function desenhar() {
  if (!D) { $('#tela').innerHTML = '<p class="vazio">Não consegui ler a central. A plataforma está rodando no Mac?</p>'; return; }
  if (!TELAS[aba]) aba = 'inicio';
  document.querySelectorAll('#abas button').forEach((b) => b.classList.toggle('on', b.dataset.a === aba));
  contadores();
  $('#tela').innerHTML = TELAS[aba]();
  if (aba === 'brutos') prepararEnvio();
}

function prepararEnvio() {
  const box = $('#envio'), input = $('#arquivo');
  const enviar = (f) => {
    if (!f) return;
    const barra = $('.barra', box), msg = $('#envioMsg');
    barra.hidden = false; msg.textContent = `Enviando ${f.name}...`;
    const x = new XMLHttpRequest();
    x.open('POST', `/api/enviar?nome=${encodeURIComponent(f.name)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) $('i', barra).style.width = `${(e.loaded / e.total) * 100}%`; };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch {} msg.textContent = x.status === 200 ? `Recebido: ${r.nome}. Os cortes saem sozinhos.` : (r.erro || 'Não foi.'); setTimeout(carregar, 1500); };
    x.onerror = () => { msg.textContent = 'O envio caiu. Tente de novo.'; };
    x.send(f);
  };
  input.onchange = () => enviar(input.files[0]);
  box.ondragover = (e) => { e.preventDefault(); box.classList.add('sobre'); };
  box.ondragleave = () => box.classList.remove('sobre');
  box.ondrop = (e) => { e.preventDefault(); box.classList.remove('sobre'); enviar(e.dataTransfer.files[0]); };
}

document.addEventListener('click', async (e) => {
  const sc = e.target.closest('[data-salvar-cred]');
  if (sc) {
    e.preventDefault();
    const rede = sc.dataset.salvarCred, inp = document.querySelector(`[data-cred="${rede}"]`);
    const r = await fetch('/api/credenciais', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ rede, [inp.dataset.campo]: inp.value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.erro || 'Não salvou.'); return; }
    inp.value = ''; carregar();
    return;
  }
  const cod = e.target.closest('[data-codigo-tiktok]');
  if (cod) {
    e.preventDefault();
    const r = await fetch('/api/tiktok-chrome/codigo');
    const j = await r.json().catch(() => ({}));
    cod.parentElement.querySelector('[data-codigo-saida]').textContent = j.codigo || j.erro || 'Não abriu.';
    return;
  }
  const b = e.target.closest('#abas button, [data-ir]');
  if (b) { aba = b.dataset.a || b.dataset.ir; history.replaceState(null, '', '#' + aba); desenhar(); scrollTo(0, 0); }
});
async function salvarConta(dados) {
  const r = await fetch('/api/contas', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.erro || 'Não salvou.'); return false; }
  C = j; return true;
}
document.addEventListener('change', async (e) => {
  const card = e.target.closest('[data-chave]');
  if (!card) return;
  const chave = card.dataset.chave;
  let ok = true;
  if (e.target.dataset.passo) ok = await salvarConta({ chave, passo: e.target.dataset.passo, feito: e.target.checked });
  else if (e.target.hasAttribute('data-arroba')) ok = await salvarConta({ chave, arroba: e.target.value });
  else if (e.target.hasAttribute('data-nota')) ok = await salvarConta({ chave, nota: e.target.value });
  if (!ok || e.target.dataset.passo) desenhar();
});
document.addEventListener('click', async (e) => {
  if (e.target.id !== 'novaConta') return;
  e.preventDefault();
  if (await salvarConta({ nova: { nome: $('#novaNome').value, rede: $('#novaRede').value } })) desenhar();
});
addEventListener('hashchange', () => { aba = location.hash.slice(1); desenhar(); });
carregar();
setInterval(() => { if (!document.querySelector('video:not([paused])') && aba !== 'brutos' && aba !== 'contas') carregar(); }, 30000);
</script>
</body>
</html>
