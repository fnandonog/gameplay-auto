<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central FNANDO</title>
<style>
  :root { --bg: #0e0f13; --card: #17191f; --card2: #20232c; --line: #2a2d38; --text: #f2f3f5; --muted: #9aa0ad; --hi: #ffe600; --ok: #2ecc71; --no: #ff6b6b; --cy: #00e0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  a { color: var(--hi); }
  header { position: sticky; top: 0; z-index: 3; background: rgba(14,15,19,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topo { display: flex; align-items: center; gap: 16px; padding: 12px 16px 0; max-width: 1080px; margin: 0 auto; }
  .topo h1 { font-size: 18px; margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; }
  .topo a { color: var(--muted); text-decoration: none; font-size: 14px; }
  nav { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; max-width: 1080px; margin: 0 auto; scrollbar-width: none; }
  nav button { flex: none; background: none; color: var(--muted); border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; font: inherit; font-size: 15px; cursor: pointer; }
  nav button.on { color: var(--text); border-bottom-color: var(--hi); font-weight: 600; }
  nav .n { margin-left: 6px; font-size: 12px; font-weight: 700; background: var(--hi); color: var(--bg); border-radius: 999px; padding: 1px 7px; }
  nav .n:empty { display: none; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 700; }
  h2:first-child { margin-top: 0; }
  .dica { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .caixa { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .lista { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .item { background: var(--card); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .item .txt { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .s { color: var(--muted); font-size: 13px; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.hi { color: var(--hi); } .pill.no { color: var(--no); } .pill.cy { color: var(--cy); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.no { background: var(--no); } .dot.hi { background: var(--hi); }
  .btn { display: inline-block; background: var(--hi); color: var(--bg); font-weight: 700; text-decoration: none; padding: 8px 14px; border-radius: 9px; border: 0; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn.sec { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
  .num { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .num div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .num b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .num span { color: var(--muted); font-size: 13px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .corte { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .corte video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; display: block; }
  .corte.longo video { aspect-ratio: 16/9; }
  .corte .c { padding: 10px 12px 12px; display: grid; gap: 6px; }
  .corte .t { font-weight: 600; font-size: 14px; }
  .corte .s { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .corte .por { font-size: 12px; color: var(--hi); }
  .rede { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .rede .cab { display: flex; gap: 12px; align-items: center; }
  .rede .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--card2); flex: none; }
  .rede .cab .txt { flex: 1; min-width: 0; }
  .rede .estado { font-size: 14px; }
  .rede details summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  .rede details summary::-webkit-details-marker { display: none; }
  .rede details[open] summary { margin-bottom: 8px; }
  .redes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .campo { background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 14px; min-width: 0; width: 100%; }
  .linha2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .passo { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; padding: 3px 0; }
  .passo input { margin-top: 4px; accent-color: var(--hi); }
  .passo.feito span { color: var(--muted); text-decoration: line-through; }
  .anon { font-size: 11px; color: var(--cy); font-weight: 700; margin-left: 4px; }
  .dia { font-weight: 700; margin: 18px 0 8px; }
  .vazio { color: var(--muted); text-align: center; padding: 30px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  .envio { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px; text-align: center; color: var(--muted); }
  .envio.sobre { border-color: var(--hi); color: var(--text); }
  .envio label { color: var(--hi); font-weight: 600; cursor: pointer; }
  .barra { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--hi); transition: width .2s; }
  details.ideia { background: var(--card); }
  details.ideia summary { padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
  details.ideia summary::-webkit-details-marker { display: none; }
  details.ideia summary .t { flex: 1; font-weight: 600; }
  details.ideia .corpo { padding: 0 14px 14px; color: #d9dbe0; font-size: 14px; white-space: pre-wrap; }
  code { background: var(--card2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  @media (max-width: 520px) { .item { flex-wrap: wrap; } .redes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1><img src="/marca/fnando-simbolo.svg" alt="" width="26" height="26">Central FNANDO</h1>
    <a href="/cortes">Editar cortes</a>
    <a href="/escritorio">Escritório</a>
  </div>
  <nav id="abas">
    <button data-a="hoje" class="on">Hoje<span class="n" data-n="hoje"></span></button>
    <button data-a="cortes">Cortes<span class="n" data-n="cortes"></span></button>
    <button data-a="agenda">Agenda</button>
    <button data-a="redes">Redes<span class="n" data-n="redes"></span></button>
    <button data-a="ideias">Ideias</button>
    <button data-a="gravacoes">Gravações</button>
  </nav>
</header>
<main id="tela"><p class="vazio">Carregando...</p></main>
<script>
let D = null, P = null, C = null, A = null;
const ANTIGAS = { inicio: 'hoje', checklist: 'hoje', longos: 'cortes', prontos: 'agenda', contas: 'redes', radar: 'ideias', roteiros: 'ideias', brutos: 'gravacoes' };
let aba = (location.hash || '#hoje').slice(1); aba = ANTIGAS[aba] || aba;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const midia = (p, a) => `/midia/${encodeURIComponent(p)}/${String(a).split('/').map(encodeURIComponent).join('/')}`;
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const mb = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const quando = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const diaDe = (iso) => { const d = new Date(iso), h = new Date(); const amanha = new Date(h.getTime() + 864e5);
  if (d.toDateString() === h.toDateString()) return 'Hoje'; if (d.toDateString() === amanha.toDateString()) return 'Amanhã';
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' }); };
const dur = (s) => s ? (s >= 60 ? `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, '0')} s` : `${Math.round(s)} s`) : '';
const NOME = { youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Página do Facebook', twitch: 'Twitch' };
const ICO = { youtube: ['YT', '#ff3b3b'], tiktok: ['TT', '#00e0ff'], instagram: ['IG', '#e1306c'], facebook: ['FB', '#4c8bf5'], twitch: ['TW', '#9146ff'] };
const ROTULO = { aguardando: ['esperando você', 'hi'], aprovado: ['aprovado', 'ok'], agendado: ['agendado', 'cy'], entregue: ['na agenda', 'cy'], postado: ['postado', 'ok'], descartado: ['descartado', 'no'], 'esperando a postagem': ['na agenda', 'cy'] };
const pill = (s) => { const [t, c] = ROTULO[s] || [s, '']; return `<span class="pill ${c}">${esc(t)}</span>`; };

async function carregar() {
  const pega = (u) => fetch(u).then((r) => r.json()).catch(() => null);
  [D, P, C, A] = await Promise.all([pega('/api/central'), pega('/api/prontidao'), pega('/api/contas'), pega('/api/apis')]);
  desenhar();
}

// ---------- the 4 networks in one place: status from the APIs/extension + the account checklist ----------
function redes() {
  const conta = (rede) => (C?.contas || []).find((c) => c.rede === rede && !c.soPara) || (C?.contas || []).find((c) => c.rede === rede);
  const met = (rede) => (D?.redes?.contas || []).find((c) => c.rede === rede && c.conectada);
  return ['tiktok', 'instagram', 'facebook', 'youtube'].map((rede) => {
    const c = conta(rede), m = met(rede);
    let estado, cor, acao;
    if (rede === 'tiktok') { estado = 'Posta pela extensão do Chrome'; cor = 'ok'; }
    else {
      const st = A?.[rede] || { status: 'falta credencial' };
      if (st.status === 'conectada') { estado = rede === 'youtube' && st.privado ? 'Conectado, mas os vídeos sobem privados (falta a auditoria do Google)' : 'Conectado: posta sozinho'; cor = rede === 'youtube' && st.privado ? 'hi' : 'ok'; }
      else if (st.status === 'erro') { estado = `Parou: ${st.motivo}`; cor = 'no'; acao = 'Conectar de novo'; }
      else if (st.status === 'falta conectar') { estado = 'Falta conectar'; cor = 'no'; acao = 'Conectar'; }
      else { estado = 'Falta colar a chave do app'; cor = 'no'; }
    }
    return { rede, c, m, estado, cor, acao, conta: (rede !== 'tiktok' && A?.[rede]?.conta) || c?.arroba || '' };
  });
}

const TELAS = {
  hoje() {
    const R = redes();
    const precisa = [];
    const esperando = D.sessoes.flatMap((s) => s.cortes).filter((c) => c.status === 'aguardando').length;
    if (esperando) precisa.push([`${esperando} corte(s) esperando você aprovar`, 'Os que o filtro deixou de fora também estão lá, com o motivo.', '<a class="btn" href="/cortes">Revisar</a>']);
    for (const r of R.filter((x) => x.cor !== 'ok')) precisa.push([`${NOME[r.rede]}: ${r.estado}`, '', '<a class="btn sec" href="#redes" data-ir="redes">Resolver</a>']);
    if (A?.postador?.pausa) precisa.push(['A postagem está pausada', A.postador.pausa.motivo || '', '<a class="btn sec" href="/escritorio">Ver</a>']);
    for (const i of (P?.itens || []).filter((i) => !i.ok && !/^conta-/.test(i.id) && i.id !== 'postagem')) precisa.push([i.titulo, i.comoFazer, i.id === 'ia' ? '<a class="btn" href="#redes" data-ir="redes">Colar a chave</a>' : '']);
    const prox = D.prontos.filter((p) => !p.postadoEm && p.agendarPara).slice(0, 5);
    const r = D.resumo;
    return `<h2>Precisa de você</h2>
    ${precisa.length ? `<div class="lista">${precisa.map(([t, s, b]) => `<div class="item"><span class="dot hi"></span><div class="txt"><div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>${b}</div>`).join('')}</div>` : '<div class="vazio">Nada. Pode jogar tranquilo: o que você gravar vira corte e entra na agenda sozinho.</div>'}
    <h2>Próximos posts</h2>
    ${prox.length ? `<div class="lista">${prox.map(itemAgenda).join('')}</div>` : '<div class="vazio">Nada agendado ainda.</div>'}
    <h2>Números</h2>
    <div class="num"><div><b>${num(r.seguidores)}</b><span>seguidores</span></div><div><b>${num(r.views7d)}</b><span>views em 7 dias</span></div><div><b>${num(r.postados)}</b><span>vídeos postados</span></div><div><b>${num(r.prontos)}</b><span>na agenda</span></div></div>`;
  },
  cortes() {
    const todos = D.sessoes.flatMap((s) => s.cortes.map((c) => ({ ...c, pasta: s.pasta, sessao: s.sessao })));
    const esp = todos.filter((c) => c.status === 'aguardando'), ok = todos.filter((c) => !['aguardando', 'descartado'].includes(c.status));
    const longos = D.sessoes.flatMap((s) => [...(s.longo ? [{ ...s.longo, pasta: s.pasta, tipo: 'Gravação inteira' }] : []), ...(s.missoes || []).map((m) => ({ ...m, pasta: s.pasta, tipo: 'Missão' }))]);
    return `<p class="dica">Para aprovar, trocar título ou descartar, abra <a href="/cortes">Editar cortes</a>. Nada é descartado sem você.</p>
    <h2>Esperando você · ${esp.length}</h2>${esp.length ? `<div class="grade">${esp.map(cardCorte).join('')}</div>` : '<div class="vazio">Nenhum corte esperando.</div>'}
    <h2>Aprovados · ${ok.length}</h2>${ok.length ? `<div class="grade">${ok.map(cardCorte).join('')}</div>` : '<div class="vazio">Nenhum aprovado ainda.</div>'}
    <h2>Vídeos longos e missões · ${longos.length}</h2>${longos.length ? `<div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${longos.map((v) => `<div class="corte longo">
      <video src="${midia(v.pasta, v.arquivo)}" ${v.thumb ? `poster="${midia(v.pasta, v.thumb)}"` : ''} controls playsinline preload="none"></video>
      <div class="c"><div class="t">${esc(v.titulo || v.missao)}</div><div class="s"><span>${esc(v.tipo)} · ${dur(v.duracao)}</span>${pill(v.status || 'aguardando')}</div>${v.aviso ? `<div class="por">${esc(v.aviso)}</div>` : ''}</div></div>`).join('')}</div>` : '<div class="vazio">Aparecem aqui depois que uma gravação é processada.</div>'}`;
  },
  agenda() {
    const ps = [...D.prontos].sort((a, b) => String(a.postadoEm || a.agendarPara || '').localeCompare(String(b.postadoEm || b.agendarPara || '')));
    const futuro = ps.filter((p) => !p.postadoEm), feito = ps.filter((p) => p.postadoEm).reverse();
    const porDia = {};
    for (const p of futuro) (porDia[p.agendarPara ? diaDe(p.agendarPara) : 'Sem horário'] ||= []).push(p);
    return `<p class="dica">Um post por horário (12:00, 18:30 e 21:00), dentro do limite seguro de cada conta.</p>
    ${futuro.length ? Object.entries(porDia).map(([d, l]) => `<div class="dia">${esc(d)}</div><div class="lista">${l.map(itemAgenda).join('')}</div>`).join('') : '<div class="vazio">Nada agendado.</div>'}
    ${feito.length ? `<h2>Já postados</h2><div class="lista">${feito.slice(0, 30).map(itemAgenda).join('')}</div>` : ''}`;
  },
  redes() {
    const R = redes();
    const card = (r) => {
      const c = r.c;
      const ajustes = r.rede === 'tiktok' ? `<div class="s" style="color:var(--muted);font-size:13px">A extensão <b>FNANDO: TikTok pelo Chrome</b> posta no horário, no Chrome logado no TikTok.</div><div class="linha2"><button class="btn sec" data-codigo-tiktok>Mostrar o código da extensão</button><code data-codigo-saida style="user-select:all;word-break:break-all"></code></div>`
        : r.rede === 'youtube' ? `<input class="campo" data-cred="youtube" data-campo="clientId" placeholder="${A?.google?.clientId ? 'ID do cliente guardado: ' + esc(A.google.clientId.slice(0, 18)) + '…' : 'ID do cliente OAuth do Google'}">
          <input class="campo" type="password" autocomplete="off" data-cred="youtube" data-campo="clientSecret" placeholder="${A?.google?.temSegredo ? 'Chave secreta guardada (cole só para trocar)' : 'Chave secreta do cliente OAuth'}">
          <div class="linha2"><button class="btn sec" data-salvar-cred="youtube">Salvar</button><a class="btn" href="/oauth/youtube/iniciar">${r.acao || 'Conectar'}</a></div>`
        : `<input class="campo" type="password" autocomplete="off" data-cred="meta" data-campo="appSecret" placeholder="${A?.meta?.temSegredo ? 'Chave secreta do app guardada (cole só para trocar)' : 'Chave secreta do app da Meta'}">
          <div class="linha2"><button class="btn sec" data-salvar-cred="meta">Salvar</button><a class="btn" href="/oauth/meta/iniciar">${r.acao || 'Conectar'}</a></div><div class="s" style="color:var(--muted);font-size:13px">Instagram e Página conectam juntos.</div>`;
      const passos = c ? `<details><summary>Configuração da conta · ${c.feitos} de ${c.total} ▾</summary><div data-chave="${esc(c.chave)}">
          ${c.passos.map((p) => `<label class="passo${p.feito ? ' feito' : ''}"><input type="checkbox" data-passo="${p.id}"${p.feito ? ' checked' : ''}><span>${esc(p.t)}${p.anonimo ? '<span class="anon">anonimato</span>' : ''}</span></label>`).join('')}
          <input class="campo" data-arroba placeholder="@ da conta" value="${esc(c.arroba)}" style="margin-top:6px"></div></details>` : '';
      return `<div class="rede">
        <div class="cab"><div class="ico" style="color:${ICO[r.rede][1]}">${ICO[r.rede][0]}</div>
          <div class="txt"><div class="t" style="font-weight:700">${esc(NOME[r.rede])}${r.conta ? ` <span style="color:var(--muted);font-weight:400">${esc(r.conta)}</span>` : ''}</div>
          <div class="estado" style="color:var(--${r.cor === 'ok' ? 'ok' : r.cor === 'hi' ? 'hi' : 'no'})">${esc(r.estado)}</div></div>
          ${r.m ? `<div style="text-align:right"><b>${num(r.m.seguidores)}</b><div class="s" style="color:var(--muted);font-size:12px">seguidores</div></div>` : ''}</div>
        ${r.acao && r.rede !== 'tiktok' ? `<a class="btn" href="/oauth/${r.rede === 'youtube' ? 'youtube' : 'meta'}/iniciar">${esc(r.acao)}</a>` : ''}
        <details${r.cor !== 'ok' && !r.acao ? ' open' : ''}><summary>Ajustes de conexão ▾</summary><div style="display:grid;gap:8px">${ajustes}</div></details>
        ${passos}
      </div>`;
    };
    const live = C?.live || [];
    const ia = `<div class="rede"><div class="cab"><div class="ico" style="color:var(--hi)">IA</div><div class="txt"><div class="t" style="font-weight:700">Chave da IA</div>
      <div class="estado" style="color:var(--${A?.ia?.temChave ? 'ok' : 'no'})">${A?.ia?.temChave ? 'Guardada: títulos e escolha dos cortes pela IA' : 'Falta: sem ela os títulos saem genéricos'}</div></div></div>
      ${A?.ia?.temChave ? '' : '<div class="s" style="color:var(--muted);font-size:13px">Crie em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> > API Keys > Create Key e cole aqui.</div>'}
      <div class="linha2"><input class="campo" type="password" autocomplete="off" data-cred="ia" data-campo="apiKey" placeholder="${A?.ia?.temChave ? 'Cole só para trocar' : 'sk-ant-...'}" style="flex:1"><button class="btn${A?.ia?.temChave ? ' sec' : ''}" data-salvar-cred="ia">Salvar</button></div></div>`;
    return `<div class="redes">${R.map(card).join('')}${ia}</div>
    <p class="dica" style="margin-top:12px">As chaves ficam só neste Mac (<code>~/Gameplay/.credenciais.json</code>) e nunca aparecem de novo na página. Conectar só funciona abrindo a central no próprio Mac.</p>
    <h2>Onde dá para fazer live</h2>
    <div class="lista">${live.map((v) => `<div class="item"><span class="dot ${v.pode ? 'ok' : 'no'}"></span><div class="txt"><div class="t">${esc(v.nome)} · ${v.pode ? 'dá hoje' : 'ainda não'}</div><div class="s">${esc(v.resumo)}</div></div></div>`).join('')}</div>`;
  },
  ideias() {
    const R = D.radar || { itens: [] };
    const it = [...R.itens].sort((a, b) => (a.cortes.length > 0) - (b.cortes.length > 0) || a.prioridade - b.prioridade);
    return `<h2>Bombando lá fora${R.atualizadoEm ? ` · ${quando(R.atualizadoEm)}` : ''}</h2>
    <p class="dica">Se você falar desses assuntos enquanto grava, o trecho vira corte com prioridade e com este título.</p>
    ${it.length ? `<div class="lista">${it.map((i) => `<details class="ideia"><summary><span class="t">${esc(i.titulo)}</span>${i.cortes.length ? '<span class="pill ok">já tem corte</span>' : i.prioridade <= 1 ? '<span class="pill hi">grave isso</span>' : ''}</summary>
      <div class="corpo">${esc([i.o_que_e || i.resumo, i.como_achar ? 'Como achar: ' + i.como_achar : '', i.tituloSugerido ? 'Título: ' + i.tituloSugerido : '', i.confirmado ? '' : 'Ainda não confirmado: confira no jogo antes.'].filter(Boolean).join('\n'))}</div></details>`).join('')}</div>` : '<div class="vazio">O radar ainda não mandou nada.</div>'}
    <h2>Roteiros</h2>
    ${D.roteiros.length ? `<div class="lista">${D.roteiros.map((r) => `<details class="ideia"><summary><span class="t">${esc(r.titulo || r.arquivo)}</span><span class="pill">${esc(r.tipo)}</span></summary><div class="corpo">${esc(r.texto)}</div></details>`).join('')}</div>` : '<div class="vazio">Nenhum roteiro.</div>'}`;
  },
  gravacoes() {
    return `<div class="envio" id="envio">Grave no OBS que a gravação entra sozinha. Para mandar outro vídeo, arraste aqui ou <label>escolha no computador<input type="file" accept="video/*" hidden id="arquivo"></label>.<div class="barra" hidden><i></i></div><div id="envioMsg"></div></div>
    <h2>Gravações</h2>
    ${D.brutos.length ? `<div class="lista">${D.brutos.map((b) => `<div class="item"><div class="txt"><div class="t">${esc(b.nome)}</div><div class="s">${quando(b.modificadoEm)}${b.duracao ? ' · ' + dur(b.duracao) : ''} · ${mb(b.bytes)}${b.sessao ? ` · ${b.cortes} corte(s)${b.longo ? ' + vídeo longo' : ''}` : ''}</div></div><span class="pill ${b.status === 'processado' ? 'ok' : b.status === 'processando' ? 'cy' : 'hi'}">${esc(b.status)}</span></div>`).join('')}</div>` : '<div class="vazio">Nenhuma gravação ainda.</div>'}`;
  },
};

function itemAgenda(p) {
  const links = Object.entries(p.links || {}).filter(([, u]) => /^https:\/\//.test(u)).map(([r, u]) => `<a class="pill cy" href="${esc(u)}" target="_blank" rel="noopener">${esc(NOME[r] || r)}</a>`).join(' ');
  return `<div class="item"><div style="min-width:52px;font-weight:700;font-variant-numeric:tabular-nums">${p.postadoEm ? hora(p.postadoEm) : p.agendarPara ? hora(p.agendarPara) : '--:--'}</div>
    <div class="txt"><div class="t">${esc(p.titulo)}</div><div class="s">${esc((p.redes || []).map((r) => NOME[r] || r).join(' · '))}${p.postadoEm ? ' · ' + diaDe(p.postadoEm) : ''}</div></div>${links || pill(p.status)}</div>`;
}

function cardCorte(c) {
  return `<div class="corte"><video src="${midia(c.pasta, c.arquivo)}" ${c.capa ? `poster="${midia(c.pasta, c.capa)}"` : ''} controls playsinline preload="none"></video>
    <div class="c"><div class="t">${esc(c.titulo)}</div><div class="s"><span>${dur((c.fim || 0) - (c.inicio || 0))}</span>${pill(c.status)}</div>
    ${c.status === 'aguardando' && c.filtro ? `<div class="por">O filtro achou: ${esc(c.filtro.join('; '))}</div>` : ''}</div></div>`;
}

function contadores() {
  const esp = D.sessoes.flatMap((s) => s.cortes).filter((c) => c.status === 'aguardando').length;
  const rr = redes().filter((r) => r.cor !== 'ok').length;
  const n = { cortes: esp || '', redes: rr || '', hoje: '' };
  document.querySelectorAll('[data-n]').forEach((el) => { el.textContent = n[el.dataset.n] ?? ''; });
}

function desenhar() {
  if (!D) { $('#tela').innerHTML = '<p class="vazio">Não consegui ler a central. Ela está rodando no Mac?</p>'; return; }
  if (!TELAS[aba]) aba = 'hoje';
  document.querySelectorAll('#abas button').forEach((b) => b.classList.toggle('on', b.dataset.a === aba));
  contadores();
  $('#tela').innerHTML = TELAS[aba]();
  if (aba === 'gravacoes') prepararEnvio();
}

function prepararEnvio() {
  const box = $('#envio'), input = $('#arquivo');
  const enviar = (f) => {
    if (!f) return;
    const barra = $('.barra', box), msg = $('#envioMsg');
    barra.hidden = false; msg.textContent = `Enviando ${f.name}...`;
    const x = new XMLHttpRequest();
    x.open('POST', `/api/enviar?nome=${encodeURIComponent(f.name)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) $('i', barra).style.width = `${(e.loaded / e.total) * 100}%`; };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch {} msg.textContent = x.status === 200 ? `Recebido: ${r.nome}. Os cortes saem sozinhos.` : (r.erro || 'Não foi.'); setTimeout(carregar, 1500); };
    x.onerror = () => { msg.textContent = 'O envio caiu. Tente de novo.'; };
    x.send(f);
  };
  input.onchange = () => enviar(input.files[0]);
  box.ondragover = (e) => { e.preventDefault(); box.classList.add('sobre'); };
  box.ondragleave = () => box.classList.remove('sobre');
  box.ondrop = (e) => { e.preventDefault(); box.classList.remove('sobre'); enviar(e.dataTransfer.files[0]); };
}

async function salvarConta(dados) {
  const r = await fetch('/api/contas', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.erro || 'Não salvou.'); return false; }
  C = j; return true;
}

document.addEventListener('click', async (e) => {
  const sc = e.target.closest('[data-salvar-cred]');
  if (sc) {
    e.preventDefault();
    const rede = sc.dataset.salvarCred, dados = { rede };
    document.querySelectorAll(`[data-cred="${rede}"]`).forEach((i) => { if (i.value.trim()) dados[i.dataset.campo] = i.value.trim(); });
    const r = await fetch('/api/credenciais', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.erro || 'Não salvou.'); return; }
    carregar();
    return;
  }
  const cod = e.target.closest('[data-codigo-tiktok]');
  if (cod) {
    const j = await fetch('/api/tiktok-chrome/codigo').then((r) => r.json()).catch(() => ({}));
    cod.parentElement.querySelector('[data-codigo-saida]').textContent = j.codigo || j.erro || 'Não abriu.';
    return;
  }
  const b = e.target.closest('#abas button, [data-ir]');
  if (b) { e.preventDefault(); aba = b.dataset.a || b.dataset.ir; history.replaceState(null, '', '#' + aba); desenhar(); scrollTo(0, 0); }
});
document.addEventListener('change', async (e) => {
  const box = e.target.closest('[data-chave]');
  if (!box) return;
  const chave = box.dataset.chave;
  if (e.target.dataset.passo) { if (await salvarConta({ chave, passo: e.target.dataset.passo, feito: e.target.checked })) e.target.closest('.passo').classList.toggle('feito', e.target.checked); }
  else if (e.target.hasAttribute('data-arroba')) await salvarConta({ chave, arroba: e.target.value });
});
addEventListener('hashchange', () => { const a = location.hash.slice(1); aba = ANTIGAS[a] || a; desenhar(); });
carregar();
// refresh every 30 s, but never while he is typing, watching or has a section open
setInterval(() => {
  const ocupado = document.activeElement?.matches('input, textarea') || [...document.querySelectorAll('video')].some((v) => !v.paused) || document.querySelector('.rede details[open]');
  if (!ocupado && aba !== 'gravacoes') carregar();
}, 30000);
</script>
</body>
