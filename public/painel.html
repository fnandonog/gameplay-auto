<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar cortes</title>
<style>
  :root { --bg: #0e0f13; --card: #17191f; --card2: #20232c; --line: #2a2d38; --text: #f2f3f5; --muted: #9aa0ad; --hi: #ffe600; --ok: #2ecc71; --no: #ff6b6b; --cy: #00e0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(14,15,19,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topo { display: flex; align-items: center; gap: 16px; padding: 12px 16px 0; max-width: 1280px; margin: 0 auto; }
  .topo h1 { font-size: 18px; margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; }
  .topo a { color: var(--muted); text-decoration: none; font-size: 14px; }
  nav { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; max-width: 1280px; margin: 0 auto; scrollbar-width: none; }
  nav button { flex: none; background: none; color: var(--muted); border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; font: inherit; cursor: pointer; }
  nav button.on { color: var(--text); border-bottom-color: var(--hi); font-weight: 600; }
  nav .n { margin-left: 6px; font-size: 12px; color: var(--muted); }
  nav button[data-f="aguardando"] .n { background: var(--hi); color: var(--bg); font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  nav .n:empty { display: none; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  .explica { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
  h2:first-of-type { margin-top: 0; }
  /* wide cards: video on the left, decisions on the right; the whole recording takes a full row; one column on phones */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 250px minmax(0, 1fr); min-width: 0; }
  .card.longo { grid-column: 1 / -1; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); }
  video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; display: block; }
  .longo video { aspect-ratio: 16/9; }
  .corpo { padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .cab { display: flex; gap: 10px; align-items: flex-start; }
  .t { font-weight: 700; font-size: 16px; line-height: 1.35; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .card, .card.longo { grid-template-columns: 1fr; }
    .card video { max-height: 70vh; }
  }
  .s { color: var(--muted); font-size: 13px; }
  .pill { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--card2); white-space: nowrap; }
  .aguardando { color: var(--hi); } .aprovado { color: var(--ok); } .agendado, .entregue { color: var(--cy); } .postado { color: var(--ok); } .descartado { color: var(--no); } .ajuste { color: var(--cy); }
  .rapida { display: grid; gap: 8px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .rapida .lin { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
  .rapida .lin > span { color: var(--muted); }
  .rapida .ctl { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .rapida .ctl.chips { gap: 6px; }
  .rapida label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .rapida input[type=checkbox], .rapida input[type=radio] { width: auto; }
  .chip { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { border-color: var(--hi); color: var(--hi); }
  .rapida input.selo { width: 120px; padding: 4px 8px; font-size: 13px; }
  .ajustes { font-size: 13px; color: #bfefff; background: rgba(0,224,255,.07); border: 1px solid rgba(0,224,255,.25); border-radius: 10px; padding: 8px 10px; }
  .porque { font-size: 13px; background: rgba(255,230,0,.08); border: 1px solid rgba(255,230,0,.25); color: #f5e9a0; padding: 8px 10px; border-radius: 10px; }
  .porque.no { background: rgba(255,107,107,.08); border-color: rgba(255,107,107,.3); color: #ffc2c2; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 8px; }
  .campos { display: grid; gap: 8px; }
  input, textarea, select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 14px; }
  textarea { min-height: 70px; resize: vertical; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .acoes button { flex: 1 1 auto; border: 0; border-radius: 10px; padding: 11px 14px; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .acoes .b-ok { flex-grow: 2; }
  .b-ok { background: var(--hi); color: var(--bg); }
  .b-sec { background: var(--card2); color: var(--text); border: 1px solid var(--line) !important; }
  .b-no { background: none; color: var(--no); border: 1px solid var(--line) !important; }
  .vazio { color: var(--muted); text-align: center; padding: 40px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  #pausa { margin: 0; padding: 10px 16px; background: var(--no); color: #fff; font-weight: 600; text-align: center; }
  #pausa button { margin-left: 8px; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1><img src="/marca/fnando-simbolo.svg" alt="" width="26" height="26">Revisar cortes</h1>
    <a href="/">Central</a>
    <a href="/escritorio">Escritório</a>
  </div>
  <nav id="filtro">
    <button data-f="aguardando" class="on">Para revisar<span class="n"></span></button>
    <button data-f="aprovado">Aprovados<span class="n"></span></button>
    <button data-f="agenda">Na agenda<span class="n"></span></button>
    <button data-f="postado">Postados<span class="n"></span></button>
    <button data-f="descartado">Descartados<span class="n"></span></button>
  </nav>
</header>
<p id="pausa" hidden>Postagem pausada: <span></span> <button>Retomar</button></p>
<main id="lista"><p class="vazio">Carregando...</p></main>
<script>
let filtro = 'aguardando', sessoes = [], linhas = [];
const GRUPO = { aguardando: 'aguardando', ajuste: 'aguardando', aprovado: 'aprovado', agendado: 'agenda', entregue: 'agenda', postado: 'postado', descartado: 'descartado' };
const EXPLICA = {
  aguardando: 'Assista e decida. Aprovado entra sozinho no próximo horário livre (12:00, 18:30 ou 21:00). Nada sai sem passar por aqui ou pelo filtro automático.',
  aprovado: 'Aprovados que ainda estão indo para a agenda (leva até 5 minutos).',
  agenda: 'Já têm horário marcado. Saem sozinhos no TikTok, Instagram, Página e YouTube.',
  postado: 'Já foram ao ar.',
  descartado: 'Só você descarta. Mudou de ideia? Volte para a revisão.',
};
const ROTULO = { aguardando: 'para revisar', ajuste: 'ajuste pedido', aprovado: 'aprovado', agendado: 'na agenda', entregue: 'na agenda', postado: 'postado', descartado: 'descartado' };
const NOMES_FORMATO = { meio: 'Meio a meio', camtopo: 'Câmera em cima', jogo: 'Só o jogo', jogocheio: 'Jogo em tela cheia' };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const midia = (p, a) => `/midia/${encodeURIComponent(p)}/${String(a).split('/').map(encodeURIComponent).join('/')}`;
const dur = (s) => s >= 60 ? `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, '0')} s` : `${Math.round(s)} s`;

async function carregar() {
  try { sessoes = await (await fetch('/api/sessoes')).json(); } catch { sessoes = []; }
  try { linhas = await (await fetch('/api/linhas')).json(); } catch { linhas = []; }
  desenhar();
}

const itens = (s) => [
  ...s.cortes.map((c) => ({ ...c, tipo: 'Short' })),
  ...(s.missoes || []).map((m) => ({ ...m, capa: m.thumb, inicio: 0, fim: m.duracao, longo: true, tipo: `Missão: ${m.missao || ''}` })),
  ...(s.longo ? [{ ...s.longo, capa: s.longo.thumb, inicio: 0, fim: s.longo.duracao, longo: true, tipo: 'Gravação inteira (YouTube)' }] : []),
];

function card(s, c) {
  const st = c.status || 'aguardando';
  const porque = st === 'aguardando' && c.filtro ? `<div class="porque">O filtro não aprovou sozinho: ${esc(c.filtro.join('; '))}. A decisão é sua.</div>`
    : c.aviso ? `<div class="porque no">⚠️ ${esc(c.aviso)}. Este nunca sai sozinho.</div>` : c.erroPost ? `<div class="porque no">Erro ao postar: ${esc(c.erroPost)}</div>` : '';
  const botoes = c.refazendo ? '<button class="b-sec" disabled>Refazendo... (alguns minutos)</button>'
    : st === 'aguardando' || st === 'ajuste' ? '<button class="b-no" data-st="descartado">Descartar</button><button class="b-sec" data-ajuste>Pedir ajuste</button><button class="b-ok" data-st="aprovado">Aprovar</button>'
    : st === 'entregue' || st === 'agendado' ? '<button class="b-sec" data-ajuste>Pedir ajuste</button>'
    : st === 'descartado' || st === 'aprovado' ? '<button class="b-sec" data-st="aguardando">Voltar para revisão</button>' : '';
  return `<article class="card${c.longo ? ' longo' : ''}" data-pasta="${esc(s.pasta)}" data-arquivo="${esc(c.arquivo)}">
    <video src="${midia(s.pasta, c.arquivo)}${c.capa ? '' : '#t=4'}" ${c.capa ? `poster="${midia(s.pasta, c.capa)}"` : ''} controls playsinline preload="${c.capa ? 'none' : 'metadata'}"></video>
    <div class="corpo">
      <div class="cab"><div class="t">${esc(c.titulo || c.missao)}</div><span class="pill ${esc(st)}">${esc(ROTULO[st] || st)}</span></div>
      <div class="s">${esc(c.tipo)} · ${dur((c.fim || 0) - (c.inicio || 0))}${c.longo ? '' : ` · nota ${Number(c.nota || 0).toFixed(1)}`}</div>
      ${porque}
      <details${st === 'aguardando' && !c.longo ? '' : ''}><summary>Editar título, texto e formato ▾</summary><div class="campos">
        <input class="titulo" value="${esc(c.titulo)}" aria-label="Título">
        <textarea class="descricao" aria-label="Descrição">${esc(c.descricao)}</textarea>
        ${c.longo ? '' : `<input class="hashtags" value="${esc((c.hashtags || []).map((h) => '#' + h).join(' '))}" aria-label="Hashtags">`}
        ${c.variantes && Object.keys(c.variantes).length > 1 ? `<select class="formato" aria-label="Formato">${Object.keys(c.variantes).map((f) => `<option value="${esc(f)}"${f === c.formato ? ' selected' : ''}>${esc(NOMES_FORMATO[f] || f)}</option>`).join('')}</select>` : ''}
        ${c.longo || linhas.length < 2 ? '' : `<select class="linha" aria-label="Canal">${linhas.map((l) => `<option value="${esc(l.id)}"${l.id === c.linha ? ' selected' : ''}>${esc(l.nome)}</option>`).join('')}</select>`}
        ${st === 'aguardando' ? '' : '<button class="b-sec" data-st="" style="border-radius:10px;padding:9px;font-weight:700">Salvar texto</button>'}
      </div></details>
      ${(c.ajustes || []).length ? `<div class="ajustes">${c.ajustes.map((a) => `${a.feito ? '✓' : '•'} ${esc(a.texto)}`).join('<br>')}</div>` : ''}
      ${c.erroRefazer ? `<div class="porque no">Não consegui refazer: ${esc(c.erroRefazer)}</div>` : ''}
      ${!c.longo && ['aguardando', 'ajuste', 'aprovado', 'entregue', 'agendado'].includes(st) && !c.refazendo ? rapida(s, c) : ''}
      <div class="pedido" hidden><textarea class="txt-ajuste" placeholder="O que precisa mudar? Ex.: corta os 2 primeiros segundos, a legenda tampa o carro, som atrasado..."></textarea>
        <div class="acoes"><button class="b-sec" data-cancelar>Cancelar</button><button class="b-ok" data-enviar-ajuste>Enviar pedido</button></div></div>
      ${botoes ? `<div class="acoes">${botoes}</div>` : ''}
    </div></article>`;
}

// quick edit: what the central redoes alone (a new version; the old file stays)
function rapida(s, c) {
  const e = c.edicao || {};
  const comCam = s.camera && s.camera !== s.jogo || (c.variantes && Object.keys(c.variantes).some((f) => f !== 'jogo' && f !== 'jogocheio'));
  const fmt = e.formato || c.formato;
  const cam = fmt !== 'jogo' && fmt !== 'jogocheio';
  const selo = e.selo ?? '';
  return `<details class="rapida-box"><summary>Edição rápida ▾</summary><div class="rapida">
    ${comCam ? `<div class="lin"><span>Câmera</span><div class="ctl chips"><button class="chip${cam ? ' on' : ''}" data-cam="meio">Com câmera</button><button class="chip${cam ? '' : ' on'}" data-cam="jogo">Só o jogo</button></div></div>` : ''}
    <div class="lin"><span>Selo</span><div class="ctl chips"><input class="selo" maxlength="24" value="${esc(selo)}" placeholder="sem selo">${['GTA 6', 'EA FC 26'].map((t) => `<button class="chip" data-selo="${t}">${t}</button>`).join('')}</div></div>
    <div class="lin"><span>Redes</span><div class="ctl"><label><input type="checkbox" class="o-arroba"${e.arroba === false ? '' : ' checked'}>@ na tela</label><label><input type="checkbox" class="o-chamada"${e.chamada === false ? '' : ' checked'}>"Segue" no fim</label></div></div>
    <div class="lin"><span>Extras</span><div class="ctl"><label><input type="checkbox" class="o-legenda"${e.legenda === false ? '' : ' checked'}>Legenda</label><label><input type="checkbox" class="o-musica"${e.musica === false ? '' : ' checked'}>Música de fundo</label></div></div>
    <button class="b-ok" data-refazer style="border:0;border-radius:10px;padding:9px;font-weight:700;cursor:pointer">Refazer com essas opções</button>
    <div class="s">Sai uma versão nova (a antiga fica guardada). Se já está na agenda e ainda não saiu, a nova entra no lugar, no mesmo horário.</div>
  </div></details>`;
}

function desenhar() {
  const conta = {};
  for (const s of sessoes) for (const c of itens(s)) { const g = GRUPO[c.status || 'aguardando'] || 'aguardando'; conta[g] = (conta[g] || 0) + 1; }
  document.querySelectorAll('#filtro button').forEach((b) => { b.classList.toggle('on', b.dataset.f === filtro); $('.n', b).textContent = conta[b.dataset.f] || ''; });
  const html = sessoes.map((s) => {
    const l = itens(s).filter((c) => (GRUPO[c.status || 'aguardando'] || 'aguardando') === filtro);
    return l.length ? `<h2>Gravação de ${esc(s.sessao)}</h2>${s.avisoMic ? `<div class="porque no" style="margin-bottom:10px">🎙️ ${esc(s.avisoMic)}</div>` : ''}<div class="grade">${l.map((c) => card(s, c)).join('')}</div>` : '';
  }).join('');
  $('#lista').innerHTML = `<p class="explica">${EXPLICA[filtro]}</p>` + (html || '<p class="vazio">Nada aqui.</p>');
}

async function salvar(art, status) {
  const v = (sel) => $(sel, art) ? $(sel, art).value : undefined;
  const body = { pasta: art.dataset.pasta, arquivo: art.dataset.arquivo, titulo: v('.titulo'), descricao: v('.descricao'), linha: v('.linha'), formato: v('.formato'),
    hashtags: $('.hashtags', art) ? $('.hashtags', art).value.split(/[\s,]+/).filter(Boolean) : undefined };
  if (status) body.status = status;
  const r = await fetch('/api/corte', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const c = await r.json();
  if (!r.ok) return alert(c.erro || 'Não salvou.');
  await carregar();
}

document.addEventListener('change', (e) => {
  const art = e.target.closest('.card');
  if (!art || !e.target.matches('.formato')) return;
  const s = sessoes.find((x) => x.pasta === art.dataset.pasta);
  const c = s && s.cortes.find((x) => x.arquivo === art.dataset.arquivo);
  if (c && c.variantes[e.target.value]) { const vid = $('video', art); vid.removeAttribute('poster'); vid.src = midia(s.pasta, c.variantes[e.target.value]); }
});
async function postar(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.erro || 'Não foi.'); return null; }
  return j;
}
document.addEventListener('click', async (e) => {
  const art = e.target.closest('.card');
  const q = (s) => e.target.closest(s);
  if (art && q('[data-ajuste]')) { $('.pedido', art).hidden = false; $('.txt-ajuste', art).focus(); return; }
  if (art && q('[data-cancelar]')) { $('.pedido', art).hidden = true; return; }
  if (art && q('[data-enviar-ajuste]')) { if (await postar('/api/ajuste', { pasta: art.dataset.pasta, arquivo: art.dataset.arquivo, texto: $('.txt-ajuste', art).value })) carregar(); return; }
  if (art && q('[data-cam]')) { art.querySelectorAll('[data-cam]').forEach((b) => b.classList.toggle('on', b === q('[data-cam]'))); return; }
  if (art && q('[data-selo]')) { const i = $('.selo', art); i.value = i.value === q('[data-selo]').dataset.selo ? '' : q('[data-selo]').dataset.selo; return; }
  if (art && q('[data-refazer]')) {
    const cam = $('[data-cam].on', art);
    const edicao = { selo: $('.selo', art).value, arroba: $('.o-arroba', art).checked, chamada: $('.o-chamada', art).checked, legenda: $('.o-legenda', art).checked, musica: $('.o-musica', art).checked };
    if (cam) edicao.formato = cam.dataset.cam;
    if (await postar('/api/refazer', { pasta: art.dataset.pasta, arquivo: art.dataset.arquivo, edicao })) { carregar(); setTimeout(carregar, 60000); }
    return;
  }
  const b = e.target.closest('[data-st]');
  if (b) { salvar(b.closest('.card'), b.dataset.st); return; }
  const f = e.target.closest('#filtro button');
  if (f) { filtro = f.dataset.f; desenhar(); scrollTo(0, 0); }
});
async function verPausa() {
  try { const { pausa } = await (await fetch('/api/pausa')).json(); $('#pausa').hidden = !pausa; if (pausa) $('#pausa span').textContent = pausa.motivo; } catch {}
}
$('#pausa button').onclick = async () => { await fetch('/api/retomar', { method: 'POST' }); verPausa(); };
verPausa();
carregar();
setInterval(verPausa, 60000);
setInterval(() => { if (!document.querySelector('input:focus, textarea:focus, details[open]') && ![...document.querySelectorAll('video')].some((v) => !v.paused)) carregar(); }, 60000);
</script>
</body>
</html>
