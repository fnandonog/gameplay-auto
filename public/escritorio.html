<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório FNANDO</title>
<style>
  :root { --bg: #0c0d11; --card: #16181f; --card2: #1e212a; --line: #262935; --text: #f2f3f5; --muted: #9aa0ad; --faint: #646a78;
    --hi: #ffe600; --ok: #2ecc71; --no: #ff6b6b; --cy: #00e0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 3; background: rgba(12,13,17,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .hd { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .hd a { color: var(--muted); text-decoration: none; font-size: 13px; }
  .hd a:hover { color: var(--text); }
  .hd .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--text); font-size: 15px; }
  .chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.auto { color: #111; background: var(--hi); border-color: var(--hi); }
  .hd .dir { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 24px 70px; }
  .topo { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .topo h1 { margin: 0; font-size: 22px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .luz { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(46,204,113,.6); animation: pulso 2s infinite; flex: none; }
  .luz.no { background: var(--no); box-shadow: 0 0 0 0 rgba(255,107,107,.6); }
  .luz.hi { background: var(--hi); box-shadow: 0 0 0 0 rgba(255,230,0,.5); }
  .luz.calmo { animation: none; background: var(--faint); }
  @keyframes pulso { 70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
  .pausa { display: flex; gap: 12px; align-items: center; background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.35); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
  .pausa .txt { flex: 1; } .pausa b { display: block; color: #ffb3b3; }
  .btn { background: var(--hi); color: #111; font-weight: 700; padding: 8px 14px; border-radius: 9px; border: 0; font-size: 13px; cursor: pointer; white-space: nowrap; }
  /* counters */
  .fluxo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 22px; }
  .fluxo div { padding: 14px 16px; border-right: 1px solid var(--line); position: relative; }
  .fluxo div:last-child { border-right: 0; }
  .fluxo div:not(:last-child)::after { content: '›'; position: absolute; right: -7px; top: 50%; transform: translateY(-50%); color: var(--faint); background: var(--card); font-size: 16px; line-height: 1; padding: 2px 0; z-index: 1; }
  .fluxo b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fluxo span { color: var(--muted); font-size: 12px; font-weight: 600; }
  .fluxo .voce b { color: var(--hi); }
  /* production line */
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .etapa { margin-bottom: 18px; }
  .etapa h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
  .etapa h2 i { font-style: normal; width: 20px; height: 20px; border-radius: 6px; background: var(--card2); color: var(--muted); display: grid; place-items: center; font-size: 11px; }
  .trilho { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 26px; position: relative; }
  .st { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; text-align: left; position: relative; display: grid; gap: 8px; align-content: start; min-height: 150px; transition: border-color .15s, transform .15s; }
  .st:hover { border-color: #3a3e4c; }
  .st.sel { border-color: var(--hi); }
  .st:not(:last-child)::after { content: ''; position: absolute; right: -27px; top: 34px; width: 26px; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .st.trabalhando:not(:last-child)::after { background: repeating-linear-gradient(90deg, var(--hi) 0 4px, transparent 4px 8px); background-size: 16px 2px; animation: esteira .6s linear infinite; }
  @keyframes esteira { to { background-position: 16px 0; } }
  .st .cb { display: flex; align-items: center; gap: 10px; }
  .av { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--card2)); color: var(--c); flex: none; position: relative; }
  .av svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .av .ponto { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--card); background: var(--faint); }
  .trabalhando .av .ponto { background: var(--hi); animation: pisca 1s infinite; } .pronto .av .ponto { background: var(--ok); } .erro .av .ponto { background: var(--no); } .esperando .av .ponto { background: var(--cy); }
  @keyframes pisca { 50% { opacity: .3; } }
  .st .nm { font-weight: 700; line-height: 1.2; } .st .es { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  .trabalhando .es { color: var(--hi); } .pronto .es { color: var(--ok); } .erro .es { color: var(--no); } .esperando .es { color: var(--cy); }
  .st .tx { font-size: 13px; color: #d4d7dd; overflow-wrap: anywhere; }
  .st .pp { font-size: 12px; color: var(--faint); }
  .st .qd { font-size: 11px; color: var(--faint); margin-top: auto; }
  .st.trabalhando { border-color: rgba(255,230,0,.45); box-shadow: 0 0 0 1px rgba(255,230,0,.12), 0 8px 30px rgba(255,230,0,.05); }
  .st.erro { border-color: rgba(255,107,107,.5); }
  .st.esperando.dono { border-color: rgba(0,224,255,.45); }
  .barra { height: 3px; border-radius: 2px; background: var(--card2); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 40%; background: var(--hi); animation: corre 1.4s ease-in-out infinite; }
  @keyframes corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .lado { display: grid; gap: 14px; position: sticky; top: 76px; }
  .caixa { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .caixa h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .caixa h3 button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; }
  .linhas { display: grid; gap: 8px; }
  .ln { display: grid; gap: 4px; padding: 10px; background: var(--card2); border-radius: 10px; }
  .ln b { display: flex; gap: 8px; align-items: center; } .ln span { color: var(--muted); font-size: 12px; }
  .tag { font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--card); color: var(--muted); }
  .tag.auto { color: var(--hi); }
  ol { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow: auto; }
  li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 0 0 12px; position: relative; }
  li::before { content: ''; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
  li:last-child::before { display: none; }
  li .bo { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--card); background: var(--c); margin-top: 3px; position: relative; z-index: 1; }
  li .q { font-size: 11px; color: var(--faint); } li .t { font-size: 13px; } li .t b { font-weight: 700; }
  li.erro .t { color: #ffb3b3; }
  .dia { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; margin: 4px 0 8px; }
  .vazio { color: var(--muted); font-size: 13px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } .lado { position: static; } }
  @media (max-width: 760px) {
    .hd, main { padding-left: 16px; padding-right: 16px; }
    .fluxo { grid-template-columns: repeat(3, 1fr); } .fluxo div:nth-child(3) { border-right: 0; } .fluxo div:nth-child(n+4) { border-top: 1px solid var(--line); } .fluxo div:nth-child(3)::after { display: none; }
    .trilho { grid-auto-flow: row; grid-auto-columns: auto; gap: 14px; }
    .st { min-height: 0; } .st:not(:last-child)::after { right: auto; left: 33px; top: auto; bottom: -15px; width: 2px; height: 14px; background: repeating-linear-gradient(180deg, var(--line) 0 4px, transparent 4px 8px); }
    .st.trabalhando:not(:last-child)::after { background: var(--hi); animation: none; }
  }
</style>
</head>
<body>
<header><div class="hd">
  <a class="marca" href="/"><img src="/marca/fnando-simbolo.svg" alt="" width="26" height="26">Escritório</a>
  <div class="dir"><span class="chip" id="modo">com aprovação</span><a href="/">← Central</a></div>
</div></header>
<main>
  <div class="topo"><h1>Linha de produção</h1><div class="status" id="status"></div></div>
  <div id="pausa"></div>
  <div class="fluxo" id="fluxo"></div>
  <div class="grid">
    <div id="linha"></div>
    <div class="lado">
      <div class="caixa"><h3 id="tlTitulo">O que aconteceu</h3><ol id="eventos"></ol></div>
      <div class="caixa"><h3>Contas que recebem os cortes</h3><div class="linhas" id="filas"></div></div>
    </div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ha = (iso) => { if (!iso) return ''; const m = Math.round((Date.now() - Date.parse(iso)) / 6e4); return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} d`; };
const ICONE = {
  vigia: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
  escriba: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>',
  cacador: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',
  roteirista: '<path d="M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8L4 8.8h6.1z"/>',
  editor: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
  montador: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
  revisor: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  agendador: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  analista: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/>',
  clipador: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
};
const ETAPAS = [
  ['Captura', 'O que você grava entra sozinho', ['vigia', 'escriba']],
  ['Criação', 'Vira corte, vídeo longo e capa', ['cacador', 'roteirista', 'editor', 'montador']],
  ['Publicação', 'Sai nas redes e volta com os números', ['revisor', 'agendador', 'analista']],
];
const ROT = { parado: 'parado', trabalhando: 'trabalhando', pronto: 'feito', esperando: 'esperando', erro: 'com erro' };
let dados = null, filtro = null;

function estacao(a) {
  return `<button class="st ${esc(a.estado)}${a.dono ? ' dono' : ''}${filtro === a.id ? ' sel' : ''}" data-ag="${a.id}" style="--c:${a.cor}">
    <div class="cb"><span class="av"><svg viewBox="0 0 24 24">${ICONE[a.id] || ''}</svg><span class="ponto"></span></span>
      <div><div class="nm">${esc(a.nome)}</div><div class="es">${esc(ROT[a.estado] || a.estado)}</div></div></div>
    ${a.estado === 'trabalhando' ? '<div class="barra"><i></i></div>' : ''}
    <div class="${a.texto ? 'tx' : 'pp'}">${esc(a.texto || a.papel)}</div>
    ${a.texto ? `<div class="pp">${esc(a.papel)}</div>` : ''}
    ${a.em ? `<div class="qd">${ha(a.em)}</div>` : ''}
  </button>`;
}

function desenhar() {
  const d = dados, T = d.totais || {};
  const ag = (id) => d.agentes.find((a) => a.id === id);
  const trab = d.agentes.filter((a) => a.estado === 'trabalhando'), erro = d.agentes.filter((a) => a.estado === 'erro');
  $('#modo').textContent = d.automatico ? 'Piloto automático' : 'Com aprovação';
  $('#modo').classList.toggle('auto', !!d.automatico);
  $('#status').innerHTML = d.pausa ? '<span class="luz no"></span>Postagem pausada'
    : erro.length ? `<span class="luz no"></span>${esc(erro.map((a) => a.nome).join(', '))} com erro`
    : trab.length ? `<span class="luz hi"></span>${esc(trab.map((a) => a.nome).join(', '))} trabalhando agora`
    : '<span class="luz"></span>Tudo em dia, esperando a próxima gravação';
  $('#pausa').innerHTML = d.pausa ? `<div class="pausa"><div class="txt"><b>A postagem está pausada</b>${esc(d.pausa.motivo || '')}</div><button class="btn" id="retomar">Retomar</button></div>` : '';
  $('#fluxo').innerHTML = [['Lives processadas', T.sessoes], ['Esperando você', T.aguardando, 'voce'], ['Aprovados', T.aprovados], ['Agendados', T.agendados], ['Postados', T.postados]]
    .map(([n, v, c]) => `<div class="${c || ''}"><b>${v ?? 0}</b><span>${n}</span></div>`).join('');
  const clip = ag('clipador');
  $('#linha').innerHTML = ETAPAS.map(([t, s, ids], i) => `<section class="etapa"><h2><i>${i + 1}</i>${t} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${s}</span></h2>
    <div class="trilho">${ids.map(ag).filter(Boolean).map(estacao).join('')}</div></section>`).join('')
    + (clip ? `<section class="etapa"><h2><i>+</i>CLIPAÍ <span style="text-transform:none;letter-spacing:0;font-weight:500">· cortes de outros streamers, só com permissão por escrito</span></h2><div class="trilho" style="grid-template-columns:minmax(0,1fr);max-width:360px">${estacao(clip)}</div></section>` : '');
  $('#filas').innerHTML = d.filas.map((f) => `<div class="ln"><b>${esc(f.nome)} ${f.automatico ? '<span class="tag auto">automático</span>' : '<span class="tag">manual</span>'}${f.terceiros ? '<span class="tag">só com permissão</span>' : ''}</b>
    <span>${esc((f.redes || []).join(' · '))}</span><span>${f.aguardando} na fila · ${f.agendados} agendado(s)${f.proximo ? ' · próximo ' + new Date(f.proximo).toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : ''}</span></div>`).join('') || '<p class="vazio">Nenhuma linha configurada.</p>';
  const evs = d.eventos.filter((e) => !filtro || e.agente === filtro);
  const nomeF = filtro && ag(filtro)?.nome;
  $('#tlTitulo').innerHTML = `${nomeF ? esc(nomeF) : 'O que aconteceu'}${filtro ? '<button id="limpar">ver todos</button>' : ''}`;
  let ultimoDia = '';
  $('#eventos').innerHTML = evs.length ? evs.map((e) => {
    const a = ag(e.agente), dia = new Date(e.em).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
    const cab = dia !== ultimoDia ? `<div class="dia">${esc(dia)}</div>` : ''; ultimoDia = dia;
    return `${cab}<li class="${e.estado === 'erro' ? 'erro' : ''}" style="--c:${a?.cor || 'var(--faint)'}"><span class="bo"></span><div><div class="q">${new Date(e.em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · ${esc(a?.nome || e.agente)}</div><div class="t">${esc(e.texto)}</div></div></li>`;
  }).join('') : `<p class="vazio">${filtro ? 'Nada dele ainda.' : 'Nada ainda. Quando você gravar, a linha começa a andar aqui.'}</p>`;
}

async function carregar() {
  try { dados = await (await fetch('/api/escritorio')).json(); } catch { return; }
  desenhar();
}
document.addEventListener('click', async (e) => {
  const st = e.target.closest('[data-ag]');
  if (st) { filtro = filtro === st.dataset.ag ? null : st.dataset.ag; desenhar(); return; }
  if (e.target.id === 'limpar') { filtro = null; desenhar(); return; }
  if (e.target.id === 'retomar') { await fetch('/api/retomar', { method: 'POST' }); carregar(); }
});
carregar();
setInterval(carregar, 5000);
</script>
</body>
</html>
